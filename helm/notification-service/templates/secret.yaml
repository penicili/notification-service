apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-service.fullname" . }}-app
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  SMTP_USER: {{ .Values.app.secrets.SMTP_USER | quote }}
  SMTP_PASSWORD: {{ .Values.app.secrets.SMTP_PASSWORD | quote }}
