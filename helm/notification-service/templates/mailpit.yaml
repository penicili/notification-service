{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-service.fullname" . }}-mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.mailpit.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mailpit
          image: "{{ .Values.mailpit.image.repository }}:{{ .Values.mailpit.image.tag }}"
          imagePullPolicy: {{ .Values.mailpit.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: {{ .Values.mailpit.service.smtpPort }}
            - name: http
              containerPort: {{ .Values.mailpit.service.httpPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- with .Values.mailpit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}