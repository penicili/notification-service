{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: {{ .Values.mailpit.service.smtpPort }}
      targetPort: smtp
    - name: http
      port: {{ .Values.mailpit.service.httpPort }}
      targetPort: http
{{- end }}
