replicaCount: 1

image:
  repository: ghcr.io/penicili/notification-service
  pullPolicy: Always
  tag: "sha-630a495"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

app:
  containerPort: 3000
  env:
    NODE_ENV: production
    PORT: "3000"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_SECURE: "false"
    MAIL_FROM: no-reply@example.com
  secrets:
    SMTP_USER: ""
    SMTP_PASSWORD: ""
  resources: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

mailpit:
  enabled: true
  replicaCount: 1
  image:
    repository: axllent/mailpit
    tag: v1.27
    pullPolicy: IfNotPresent
  service:
    smtpPort: 1025
    httpPort: 8025
  resources: {}

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: notification.test.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
