replicaCount: 1
image:
  repository: ghcr.io/penicili/notification-service
  pullPolicy: Always
  tag: "sha-dbcde3d"
# Set this when the GHCR package is private, for example:
# imagePullSecrets:
#   - name: ghcr-secret
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
app:
  containerPort: 3000
  env:
    NODE_ENV: production
    PORT: "3000"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_SECURE: "false"
    MAIL_FROM: no-reply@example.com
  secrets:
    SMTP_USER: ""
    SMTP_PASSWORD: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
service:
  type: ClusterIP
  port: 80
  targetPort: http
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
mailpit:
  # Mailpit untuk test/staging, disable di prod
  enabled: true
  replicaCount: 1
  image:
    repository: axllent/mailpit
    tag: v1.27
    pullPolicy: IfNotPresent
  service:
    smtpPort: 1025
    httpPort: 8025
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: notification.test.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
nodeSelector: {}
tolerations: []
affinity: {}
