apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: notification-runner
  namespace: actions-runner-system
spec:
  replicas: 1
  template:
    spec:
      repository: penicili/notification-service
      labels:
        - notification-service
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi