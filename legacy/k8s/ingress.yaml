apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notification-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: "notification.test.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: notification-app
            port:
              number: 80
